spring:
  application:
    name: frailty-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:frailty-ai-super-secret-key-32chars-min!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.frailty: DEBUG
